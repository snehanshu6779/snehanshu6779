<svg width="1200" height="320" viewBox="0 0 1200 320"
     xmlns="http://www.w3.org/2000/svg">

<defs>

    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#050816"/>
        <stop offset="50%" stop-color="#0f172a"/>
        <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="text" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#22d3ee"/>
        <stop offset="50%" stop-color="#60a5fa"/>
        <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <filter id="glow">
        <feGaussianBlur stdDeviation="8" result="blur"/>
        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>
    </filter>

</defs>

<rect width="1200" height="320" rx="24" fill="url(#bg)"/>

<!-- Grid -->

<g opacity="0.08" stroke="#ffffff">

    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>

    <line x1="100" y1="0" x2="100" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="320"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="400" y1="0" x2="400" y2="320"/>
    <line x1="500" y1="0" x2="500" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="700" y1="0" x2="700" y2="320"/>
    <line x1="800" y1="0" x2="800" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
    <line x1="1000" y1="0" x2="1000" y2="320"/>
    <line x1="1100" y1="0" x2="1100" y2="320"/>

</g>

<!-- Animated glow -->

<circle cx="160" cy="70" r="50"
        fill="#22d3ee"
        opacity="0.08">

    <animate
        attributeName="r"
        values="40;70;40"
        dur="4s"
        repeatCount="indefinite"/>

</circle>

<circle cx="1050" cy="250" r="60"
        fill="#a78bfa"
        opacity="0.08">

    <animate
        attributeName="r"
        values="50;80;50"
        dur="5s"
        repeatCount="indefinite"/>

</circle>

<!-- Name -->

<text x="600"
      y="110"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="52"
      font-weight="700"
      fill="url(#text)"
      filter="url(#glow)">
    SNEHANSHU MANDAL
</text>

<!-- Title -->

<text x="600"
      y="160"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="24"
      font-weight="600"
      fill="#e5e7eb">

    DATA ANALYST • BUSINESS INTELLIGENCE • AUTOMATION

</text>

<!-- Tagline -->

<text x="600"
      y="205"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="18"
      fill="#94a3b8">

    Turning Data → Insights → Decisions → Impact

</text>

<!-- Data nodes -->

<g fill="#22d3ee">

    <circle cx="380" cy="255" r="5">
        <animate
            attributeName="opacity"
            values="0.3;1;0.3"
            dur="2s"
            repeatCount="indefinite"/>
    </circle>

    <circle cx="450" cy="275" r="5">
        <animate
            attributeName="opacity"
            values="1;0.3;1"
            dur="2.5s"
            repeatCount="indefinite"/>
    </circle>

    <circle cx="520" cy="250" r="5">
        <animate
            attributeName="opacity"
            values="0.3;1;0.3"
            dur="1.8s"
            repeatCount="indefinite"/>
    </circle>

    <circle cx="680" cy="250" r="5">
        <animate
            attributeName="opacity"
            values="1;0.3;1"
            dur="2.3s"
            repeatCount="indefinite"/>
    </circle>

    <circle cx="750" cy="275" r="5">
        <animate
            attributeName="opacity"
            values="0.3;1;0.3"
            dur="2s"
            repeatCount="indefinite"/>
    </circle>

    <circle cx="820" cy="255" r="5">
        <animate
            attributeName="opacity"
            values="1;0.3;1"
            dur="2.7s"
            repeatCount="indefinite"/>
    </circle>

</g>

<!-- Bottom line -->

<rect x="350"
      y="290"
      width="500"
      height="2"
      rx="1"
      fill="url(#text)">

    <animate
        attributeName="width"
        values="300;500;300"
        dur="4s"
        repeatCount="indefinite"/>

</rect>

</svg>
